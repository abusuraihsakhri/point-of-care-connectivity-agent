name: Test and package

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q agents point_of_care_connectivity_agent cli.py poct_sentinel.py enrichment.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; src=Path('web/index.html').read_text(); script=re.search(r'<script>(.*?)</script>',src,re.S); assert script; Path('/tmp/poct-console.js').write_text(script.group(1))"
          node --check /tmp/poct-console.js
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed CLI
        run: |
          python -m pip check
          point-of-care-connectivity-agent --help
